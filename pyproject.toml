[project]
name = "chorus"
version = "0.1.0"
description = "Multi-agent psychological decision analysis system"
requires-python = ">=3.11"
dependencies = [
    "dashscope>=1.25.17",
    "jinja2>=3.1.6",
    "langchain-community>=0.4.1",
    "langchain-core>=1.3.0",
    "langchain-openai>=1.1.14",
    "langgraph>=1.1.8",
    "langgraph-checkpoint-sqlite>=3.0.3",
    "python-dotenv>=1.2.2",
    "questionary>=2.0.1",
    "rich>=13.0.0",
    "tavily-python>=0.7.23",
    "typer>=0.12.0",
]

[project.scripts]
chorus = "chorus.cli:main"

[dependency-groups]
dev = [
    "langgraph-cli[inmem]>=0.4.23",
    "pytest>=9.0.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/chorus"]
